<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--APP-HEAD-START-->
<meta name="theme-color" content="#0b7a5f">
<meta name="description" content="موقع أفضل المعروض للسيارات: محرك بحث يجمع لك أفضل عروض السيارات المستعملة من حراج وسيارة وسوم وغيرها بروابط مباشرة. نبدأ من المدينة المنورة. مجاناً خلال الفترة التجريبية.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<!--APP-HEAD-END-->
<title>أفضل المعروض للسيارات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="trial" role="status">
  <div class="wrap"><span data-i="trial"></span></div>
</div>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#top">
      <svg width="36" height="36" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#0b7a5f"/><circle cx="29" cy="28" r="12" fill="none" stroke="#fff" stroke-width="5"/><path d="M38 37l10 10" stroke="#fff" stroke-width="6" stroke-linecap="round"/><circle cx="29" cy="28" r="4" fill="#e3a33b"/></svg>
      <span><b data-i="brand"></b><small data-i="tagline"></small></span>
    </a>
    <select class="lang" id="langSel" aria-label="Language / اللغة / زبان">
      <option value="ar">العربية</option>
      <option value="en">English</option>
      <option value="ur">اردو</option>
    </select>
  </div>
</header>

<button type="button" class="ws-bar" id="wsOpen">
  <span class="wrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14.7 6.3a4 4 0 00-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 005.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg><b data-i="wsBar"></b><span class="ws-go" data-i="wsBarGo"></span></span>
</button>

<main id="top">
  <!-- HERO -->
  <section class="hero">
    <div class="wrap hero-inner">
      <span class="city-badge"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 00-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 00-7-7zm0 9.5A2.5 2.5 0 1112 6a2.5 2.5 0 010 5.5z"/></svg><span data-i="cityBadge"></span></span>
      <h1 data-ih="heroTitle"></h1>
      <p class="lead" data-i="heroLead"></p>
      <a class="btn btn-primary btn-big" href="#search" data-i="ctaSearch"></a>
      <div class="live-stats" id="statsRow" aria-live="polite">
        <span class="live"><i></i><span data-i="liveLbl"></span></span>
        <div class="stat"><b id="stToday" class="num">–</b><span data-i="statToday"></span></div>
        <div class="stat"><b id="stVisits" class="num">–</b><span data-i="statVisits"></span></div>
        <div class="stat"><b id="stSearches" class="num">–</b><span data-i="statSearches"></span></div>
        <div class="stat"><b id="stRating" class="num">–</b><span data-i="statRating"></span></div>
      </div>
    </div>
  </section>

  <!-- SEARCH -->
  <section class="block" id="search">
    <div class="wrap">
      <div class="search-grid">
        <form class="panel search-form" id="searchForm" novalidate>
          <h2 data-i="searchTitle"></h2>
          <div class="budget-box">
            <div class="budget-top">
              <label for="budget" class="lbl" data-i="budgetLabel"></label>
              <output id="budgetOut" class="num" for="budget">30,000</output>
            </div>
            <input type="range" id="budget" name="budget" min="5000" max="300000" step="1000" value="30000">
            <div class="chips" id="budgetChips"></div>
          </div>
          <div class="row2">
            <div class="field"><label for="make" data-i="make"></label><select id="make" name="make"></select></div>
            <div class="field"><label for="model" data-i="model"></label><select id="model" name="model"></select></div>
          </div>
          <div class="field"><label for="city" data-i="city"></label><select id="city" name="city"></select></div>

          <details class="more" id="moreOpts">
            <summary data-i="moreOptions"></summary>
            <div class="more-body">
              <div class="row2">
                <div class="field"><label for="yearFrom" data-i="yearFrom"></label><select id="yearFrom" name="yearFrom"></select></div>
                <div class="field"><label for="yearTo" data-i="yearTo"></label><select id="yearTo" name="yearTo"></select></div>
              </div>
              <div class="field"><label for="bodyType" data-i="bodyType"></label><select id="bodyType" name="bodyType"></select></div>
              <div class="field">
                <span class="lbl" data-i="featuresLabel"></span>
                <div class="chips" id="featureChips" role="group"></div>
              </div>
            </div>
          </details>
          <button class="btn btn-primary btn-big" type="submit" data-i="searchBtn"></button>
        </form>

        <div class="results" id="results" aria-live="polite">
          <p class="danger" role="alert" data-i="liability"></p>

          <div class="panel" id="lowPanel" hidden>
            <h3 data-i="lowTitle"></h3>
            <p class="muted small" data-i="lowLead"></p>
            <p class="danger small" data-i="lowWarn"></p>
            <div class="low-list" id="lowList"></div>
          </div>

          <div class="panel" id="resultPanel">
            <h3 id="resTitle"></h3>
            <p class="muted small" id="resSub"></p>
            <div class="chips year-chips" id="yearChips"></div>
            <div class="plat-links" id="platLinks"></div>
            <p class="muted small" id="checkNote" hidden></p>
            <p class="muted small" id="hiddenNote" hidden></p>
            <a class="deep" id="deepLink" target="_blank" rel="noopener">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
              <span><b data-i="deepTitle"></b><small id="deepSub"></small></span>
            </a>
            <p class="method" data-i="method"></p>
          </div>

          <div class="panel" id="optionsPanel">
            <h3 data-i="optionsTitle"></h3>
            <p class="muted small" id="optionsSub"></p>
            <div class="options" id="options"></div>
          </div>

          <div class="best locked" id="best">
            <div class="best-head"><span data-i="bestHead"></span><span id="bestConf" class="num"></span></div>
            <div class="best-body" id="bestBody"></div>
            <div class="lock">
              <div class="lock-inner">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
                <b data-i="bestLocked"></b>
                <p class="muted small" data-i="bestLockedText"></p>
                <button class="btn btn-gold" type="button" id="revealBtn" data-i="revealBtn"></button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- MADINAH -->
  <section class="block" id="madinah">
    <div class="wrap narrow">
      <h2 data-i="madTitle"></h2>
      <p class="muted" data-i="madLead"></p>
      <div class="soon-list">
        <div class="soon-item"><span class="dot"></span><div><h3 data-i="m1t"></h3><p data-i="m1d"></p></div></div>
        <div class="soon-item"><span class="dot"></span><div><h3 data-i="m2t"></h3><p data-i="m2d"></p></div></div>
        <div class="soon-item"><span class="dot"></span><div><h3 data-i="m3t"></h3><p data-i="m3d"></p></div></div>
        <div class="soon-item"><span class="dot"></span><div><h3 data-i="m4t"></h3><p data-i="m4d"></p></div></div>
      </div>
    </div>
  </section>

  <!-- SAFETY -->
  <section class="block" id="safety">
    <div class="wrap narrow">
      <h2 data-i="safeTitle"></h2>
      <div class="danger danger-lg" role="note">
        <p data-i="resp1"></p>
        <p data-i="resp2"></p>
      </div>
      <details class="fold">
        <summary data-i="stepsTitle"></summary>
        <ol class="steps">
          <li><span data-i="s1"></span></li>
          <li><span data-i="s2"></span></li>
          <li><span data-i="s3"></span></li>
          <li><span data-i="s4"></span></li>
          <li><span data-i="s5"></span></li>
          <li><span data-i="s6"></span></li>
        </ol>
        <div class="official" id="official"></div>
      </details>
      <details class="fold">
        <summary data-i="sellerTitle"></summary>
        <p class="muted small" data-i="sellerLead"></p>
        <div class="seller-score"><span data-i="sellerScore"></span><b id="sellerPct" class="num">0%</b></div>
        <div class="meter"><i id="sellerBar"></i></div>
        <p id="sellerVerdict" class="small" style="font-weight:600"></p>
        <div class="checklist" id="sellerChecks"></div>
      </details>
    </div>
  </section>

  <!-- YOUR PLATFORM -->
  <section class="block" id="yours">
    <div class="wrap narrow">
      <h2 data-i="yoursTitle"></h2>
      <p class="muted" data-i="yoursLead"></p>
      <div class="panel yours">
        <div class="field"><label for="sugText" data-i="sugLabel"></label><textarea id="sugText" rows="3"></textarea></div>
        <div class="stars-row">
          <span class="small" data-i="rateLabel"></span>
          <div class="stars" id="stars" role="radiogroup" aria-label="Rating"></div>
        </div>
        <button class="btn btn-primary" type="button" id="sendBtn" data-i="sendBtn"></button>
      </div>
      <div class="panel support">
        <h3 data-i="supportTitle"></h3>
        <p class="muted small" data-i="supportLead"></p>
        <div class="contact">
          <a href="mailto:dromda@hotmail.com"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><span><small data-i="emailLbl"></small><b dir="ltr">dromda@hotmail.com</b></span></a>
          <a href="tel:+966555801087"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1.9.4 1.8.7 2.7a2 2 0 01-.5 2.1L8 9.8a16 16 0 006 6l1.3-1.3a2 2 0 012.1-.4c.9.3 1.8.6 2.7.7a2 2 0 011.7 2z"/></svg><span><small data-i="phoneLbl"></small><b dir="ltr">00966 555801087</b></span></a>
        </div>
      </div>
      <div class="reviews" id="reviews"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <p class="danger-text" data-i="footerLiability"></p>
    <p data-i="footer1"></p>
    <p><span data-i="supportTitle"></span>: <a href="mailto:dromda@hotmail.com" dir="ltr">dromda@hotmail.com</a> · <a href="tel:+966555801087" dir="ltr">00966 555801087</a></p>
    <p><button type="button" id="openTerms" data-i="footerTerms"></button> · <button type="button" id="openPrivacy" data-i="footerPrivacy"></button></p>
    <p>© 2026 <span data-i="brand"></span></p>
  </div>
</footer>

<nav class="bnav" aria-label="App">
  <div class="wrap">
    <a href="#top"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg><span data-i="navHome"></span></a>
    <a href="#search"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span data-i="navSearch"></span></a>
    <a href="#workshops" id="wsNav"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a4 4 0 00-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 005.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg><span data-i="navWorkshops"></span></a>
    <a href="#madinah"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a7 7 0 00-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 00-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg><span data-i="navMadinah"></span></a>
    <a href="#yours"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg><span data-i="navYours"></span></a>
  </div>
</nav>

<div class="modal" id="termsModal" hidden role="dialog" aria-modal="true" aria-labelledby="termsTitle">
  <div class="sheet">
    <h2 id="termsTitle" data-i="termsTitle"></h2>
    <p class="free" data-i="termsFree"></p>
    <ol>
      <li data-i="t1"></li>
      <li data-i="t2"></li>
      <li data-i="t3"></li>
      <li class="danger-text" data-i="t4"></li>
      <li data-i="t5"></li>
    </ol>
    <label class="check"><input type="checkbox" id="termsCheck"><span data-i="termsCheck"></span></label>
    <div class="sheet-actions">
      <button class="btn btn-ghost" type="button" id="termsCancel" data-i="termsCancel"></button>
      <button class="btn btn-primary" type="button" id="termsAgree" data-i="termsAgree" disabled></button>
    </div>
  </div>
</div>

<div class="modal" id="wsModal" hidden role="dialog" aria-modal="true" aria-labelledby="wsTitle">
  <div class="sheet">
    <h2 id="wsTitle" data-i="wsTitle"></h2>
    <p data-i="wsLead"></p>
    <ul class="ws-perks">
      <li data-i="wsPerk1"></li>
      <li data-i="wsPerk2"></li>
      <li data-i="wsPerk3"></li>
    </ul>
    <p class="lbl" data-i="wsContact"></p>
    <div class="contact">
      <a href="mailto:dromda@hotmail.com"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><span><small data-i="emailLbl"></small><b dir="ltr">dromda@hotmail.com</b></span></a>
      <a href="tel:+966555801087"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1.9.4 1.8.7 2.7a2 2 0 01-.5 2.1L8 9.8a16 16 0 006 6l1.3-1.3a2 2 0 012.1-.4c.9.3 1.8.6 2.7.7a2 2 0 011.7 2z"/></svg><span><small data-i="phoneLbl"></small><b dir="ltr">00966 555801087</b></span></a>
    </div>
    <div class="sheet-actions"><button class="btn btn-primary" type="button" id="wsClose" data-i="close"></button></div>
  </div>
</div>

<div class="modal" id="privacyModal" hidden role="dialog" aria-modal="true" aria-labelledby="privacyTitle">
  <div class="sheet">
    <h2 id="privacyTitle" data-i="privacyTitle"></h2>
    <p data-i="privacyText"></p>
    <div class="sheet-actions"><button class="btn btn-primary" type="button" id="privacyClose" data-i="close"></button></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
